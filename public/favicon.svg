<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#a8c8ff"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff2a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64d5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#64d5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>

  <!-- Flame -->
  <path d="M 24 48 Q 26 54 28 58 Q 30 62 32 58 Q 34 62 36 58 Q 38 54 40 48 Z" fill="url(#flameGrad)"/>
  <path d="M 28 48 Q 29 52 30 55 Q 31 57 32 55 Q 33 57 34 55 Q 35 52 36 48 Z" fill="#fff5a8" opacity="0.8"/>

  <!-- Fins -->
  <polygon points="18,42 24,36 24,48" fill="#ff6b35"/>
  <polygon points="46,42 40,36 40,48" fill="#ff6b35"/>

  <!-- Body -->
  <path d="M 24 16 Q 24 8 32 4 Q 40 8 40 16 L 40 48 L 24 48 Z" fill="url(#bodyGrad)" stroke="#4da6ff" stroke-width="1.5"/>

  <!-- Windows -->
  <circle cx="32" cy="20" r="3.5" fill="#4da6ff" stroke="#1a5a99" stroke-width="1"/>
  <circle cx="32" cy="20" r="2" fill="#64d5ff" opacity="0.7"/>

  <!-- Body detail -->
  <circle cx="32" cy="32" r="2" fill="#4da6ff"/>
  <circle cx="32" cy="40" r="2" fill="#4da6ff"/>

  <!-- Engine nozzle -->
  <rect x="26" y="46" width="12" height="4" fill="#444" rx="1"/>
</svg>
